name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag, so pin the full version.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest
        env:
          # Fail instead of skipping database tests if Docker is missing.
          REQUIRE_DOCKER: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-client:
    name: API client matches the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag, so pin the full version.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Export the OpenAPI schema
        working-directory: backend
        run: uv sync --locked && uv run python scripts/export_openapi.py
      - name: Regenerate the client
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm generate:api
      - name: Fail if anything changed
        run: |
          if [ -n "$(git status --porcelain -- backend/openapi.json frontend/src/api)" ]; then
            git status --porcelain -- backend/openapi.json frontend/src/api
            echo "Run scripts/export_openapi.py and pnpm generate:api, then commit the result."
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On pull requests, gitleaks reads the PR's commit list.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Development stack (ADR-0004). Copy .env.example to .env first, then: docker compose up --build
name: hubnisio

x-backend: &backend
  build: ./backend
  image: hubnisio-backend
  # Build (from cache, so it's quick) on every `up` and `run`: a stale image would run old
  # migrations, e.g. `docker compose run` before the first `up --build`.
  pull_policy: build
  environment:
    HUBNISIO_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hubnisio}
    HUBNISIO_DEV_USER_EMAIL: ${HUBNISIO_DEV_USER_EMAIL:?set HUBNISIO_DEV_USER_EMAIL in .env}
    HUBNISIO_ENABLE_BANKING_APP_ID: ${HUBNISIO_ENABLE_BANKING_APP_ID:-}
    HUBNISIO_ENABLE_BANKING_KEY_FILE: /run/secrets/enable_banking_key
    HUBNISIO_ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
    # File-change events don't cross from a Windows host into the container; poll instead.
    WATCHFILES_FORCE_POLLING: "true"
  secrets:
    - enable_banking_key
    - encryption_keys

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hubnisio}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "hubnisio.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src"]
    volumes:
      - ./backend/src:/app/src
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["procrastinate", "--app=hubnisio.worker.app", "worker"]
    volumes:
      - ./backend/src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://api:8000
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      WATCH_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep Linux node_modules inside the container, apart from the host's.
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  db-data:
  frontend-node-modules:

# Mounted as files, never passed as environment variables (ADR-0004). secrets/ is gitignored.
secrets:
  enable_banking_key:
    file: ./secrets/enable-banking.pem
  encryption_keys:
    file: ./secrets/encryption-keys

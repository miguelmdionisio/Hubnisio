[project]
name = "hubnisio"
version = "0.1.0"
description = "Personal hub backend: API and background worker."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.159.1",
    "garmin-fit-sdk==21.218.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "procrastinate==3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pywebpush==2.5.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests", "migrations"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.importlinter]
root_package = "hubnisio"

[[tool.importlinter.contracts]]
name = "Entrypoints on top, domain modules in the middle (never importing each other), core at the bottom"
type = "layers"
layers = [
    "main | worker | cli | ai",
    "jobs",
    "finance | health",
    "core",
]
containers = ["hubnisio"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]
